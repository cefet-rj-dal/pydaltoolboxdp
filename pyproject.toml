[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydaltoolboxdp"
version = "0.6.0"
description = "Deep ++ extensions for pydaltoolbox, pytspredit, and pyharbinger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
maintainers = [
  { name = "Eduardo Ogasawara", email = "eogasawara@ieee.org" },
]
authors = [
  { name = "Eduardo Ogasawara", email = "eogasawara@ieee.org" },
  { name = "Diego Salles", email = "diego.salles@eic.cefet-rj.br" },
  { name = "Erich Carvalho", email = "erich.carvalho@eic.cefet-rj.br" },
  { name = "Janio Lima", email = "janio.lima@eic.cefet-rj.br" },
  { name = "Joao Kongevold", email = "joao.kongevold@eic.cefet-rj.br" },
  { name = "Lucas Tavares", email = "lucas.tavares@eic.cefet-rj.br" },
  { name = "Eduardo Bezerra", email = "ebezerra@cefet-rj.br" },
  { name = "CEFET/RJ" },
]
keywords = [
  "deep learning",
  "autoencoder",
  "time series",
  "event detection",
  "experiment line",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "torch>=2.0",
  "pydaltoolbox>=0.25.0",
  "pytspredit>=0.13.0",
  "pyharbinger>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "build", "twine"]
docs = [
  "jupytext>=1.16",
  "nbconvert>=7",
  "nbclient>=0.9",
  "ipykernel>=6",
  "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/cefet-rj-dal/pydaltoolboxdp"
Repository = "https://github.com/cefet-rj-dal/pydaltoolboxdp"
"Bug Tracker" = "https://github.com/cefet-rj-dal/pydaltoolboxdp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pydaltoolboxdp"]

[tool.hatch.build.targets.sdist]
include = ["src/pydaltoolboxdp", "README.md", "LICENSE"]
exclude = ["develop", "notebooks", "examples", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
